<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MiBiblioteca</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>📚 MiBiblioteca</h1>
    <p>Organizá tus libros favoritos</p>
</header>

<main>

<form onsubmit="return guardarLibro()">

    <input
        type="text"
        id="titulo"
        placeholder="Título del libro">

    <input
        type="text"
        id="autor"
        placeholder="Autor">

    <select id="genero">
        <option>Novela</option>
        <option>Historia</option>
        <option>Ciencia ficción</option>
    </select>

    <input
        type="submit"
        value="Guardar libro">

</form>

<button onclick="mostrarLibros()">
    Ver recomendaciones
</button>

<div id="mensaje"></div>

<div id="libros"></div>

<footer>
    MiBiblioteca 2026
</footer>

</main>

<script src="js/script.js"></script>

</body>
</html>
